name: Build LUMI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unpack LUMI project
        run: |
          rm -rf LUMI_Live_Avatar
          unzip -q LUMI_Live_Avatar_MVP_GPU_LIVE.zip
          test -f LUMI_Live_Avatar/android/settings.gradle.kts

      - name: Build debug APK
        working-directory: LUMI_Live_Avatar/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          cp LUMI_Live_Avatar/android/app/build/outputs/apk/debug/app-debug.apk LUMI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMI-Android-APK
          path: LUMI.apk
          if-no
